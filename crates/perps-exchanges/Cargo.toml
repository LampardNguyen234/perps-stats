[package]
name = "perps-exchanges"
version = "0.1.0"
edition = "2021"

[dependencies]
# Workspace crates
perps-core = { path = "../perps-core" }

# HTTP client
# gzip/brotli/deflate: Nado's gateway rejects requests whose Accept-Encoding doesn't advertise
# one of these (403 "Invalid compression headers"); these features make reqwest send that
# header and transparently decompress the response, rather than us building the header by hand
# and then failing to decode a gzipped body.
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate"] }

# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# WebSocket client
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
yawc = "0.3.4"
url = "2.5"
futures = "0.3"
async-stream = "0.3"

# Async trait support
async-trait = "0.1"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"

# Decimal and date/time (re-exported from core, but needed for conversions)
rust_decimal = "1.37"
chrono = "0.4"

# Async runtime
tokio = { version = "1.41", features = ["sync"] }

# Cache support
once_cell = "1.20"

# TOML config parsing (symbol aliases)
toml = { version = "0.8", features = ["parse"] }

# CRC32-IEEE for orderbook checksum validation
crc32fast = "1.4"

[features]
default = ["streaming"]
streaming = []

[dev-dependencies]
rust_decimal_macros = "1.37"
